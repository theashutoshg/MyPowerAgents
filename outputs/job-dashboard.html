// Populate source filter
const sourceSet = [...new Set(jobs.map(j => j.source))];
const filterSource = document.getElementById('filterSource');
sourceSet.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; filterSource.appendChild(o); });

function filterJobs() {
  const q = document.getElementById('search').value.toLowerCase();
  const level = document.getElementById('filterLevel').value;
  const source = document.getElementById('filterSource').value;
  const loc = document.getElementById('filterLocation').value;
  const sort = document.getElementById('sortBy').value;

  let filtered = jobs.filter(j => {
    if (q && !(j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.desc.toLowerCase().includes(q))) return false;
    if (level && j.level !== level) return false;
    if (source && j.source !== source) return false;
    if (loc === 'Remote' && !j.remote) return false;
    if (loc === 'San Francisco' && j.remote && !j.hybrid) return false;
    if (loc === 'Hybrid' && !j.hybrid) return false;
    return true;
  });

  if (sort === 'pay-high') filtered.sort((a, b) => (b.payMax || 0) - (a.payMax || 0));
  else if (sort === 'pay-low') filtered.sort((a, b) => (a.pay || 0) - (b.pay || 0));
  else if (sort === 'alpha') filtered.sort((a, b) => a.company.localeCompare(b.company));
  else filtered.sort((a, b) => (b.payMax || 0) - (a.payMax || 0));

  renderGrid(filtered);
}

function renderGrid(list) {
  const grid = document.getElementById('grid');
  document.getElementById('countDisplay').textContent = `Showing ${list.length} of ${jobs.length} roles`;
  grid.innerHTML = list.map(j => `
    <div class="card">
      <div class="card-top">
        <div class="card-company">${j.company}</div>
        <span class="badge badge-level">${j.level}</span>
      </div>
      <div class="card-title"><a href="${j.url}" target="_blank" rel="noopener">${j.title}</a></div>
      <div class="card-meta">
        <span>📍 ${j.location}</span>
        ${j.pay ? `<span>💰 $${(j.pay/1000).toFixed(0)}K – $${(j.payMax/1000).toFixed(0)}K</span>` : ''}
      </div>
      <div class="card-desc">${j.desc}</div>
      <div class="card-badges">
        <span class="badge badge-source">${j.source}</span>
        ${j.remote ? '<span class="badge badge-remote">Remote</span>' : ''}
        ${j.hybrid ? '<span class="badge badge-remote">Hybrid</span>' : ''}
        ${j.easyApply ? '<span class="badge badge-easy">Easy Apply</span>' : ''}
        ${j.leadership ? '<span class="badge badge-leadership">Leadership</span>' : ''}
      </div>
      <div class="card-bottom">
        <div class="pay">${j.pay ? `$${(j.pay/1000).toFixed(0)}K–$${(j.payMax/1000).toFixed(0)}K` : 'Pay not listed'}</div>
        <a class="apply-btn" href="${j.url}" target="_blank" rel="noopener">Apply →</a>
      </div>
    </div>
  `).join('');
}

// Stats
const leadershipCount = jobs.filter(j => j.leadership).length;
const remoteCount = jobs.filter(j => j.remote).length;
const withPayCount = jobs.filter(j => j.pay).length;
document.getElementById('stats').innerHTML = `
  <div class="stat"><strong>${jobs.length}</strong> total roles</div>
  <div class="stat"><strong>${leadershipCount}</strong> leadership</div>
  <div class="stat"><strong>${remoteCount}</strong> remote</div>
  <div class="stat"><strong>${withPayCount}</strong> with salary data</div>
  <div class="stat"><strong>${sourceSet.length}</strong> sources</div>
`;

filterJobs();
</script>
